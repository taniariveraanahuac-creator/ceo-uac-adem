<title>CEO León · Anáhuac Cancún</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* CEO León · modo arena oscuro. Un solo tema oscuro a propósito: base #121214, tarjetas #1E1E24.
   El naranja Anáhuac funciona como acento neón SOLO para lo activo: botones, selección y éxito.
   Iris (violeta) para datos neutros; verde y rojo apagado para ganancias y pérdidas. */
:root{color-scheme:dark;--bg:#121214;--card:#1E1E24;--card2:#26262E;--deep:#16161A;--line:#30303A;--line2:#43434F;--fg:#F4F1EC;--soft:#CFCAD4;--mute:#A39EAB;
--o:#FF7A1A;--o2:#FFAE5C;--glow:rgba(255,122,26,.55);--onO:#1A0D04;--ok:#45D69A;--okbg:rgba(69,214,154,.12);--bad:#E07A7F;--badbg:rgba(224,122,127,.12);--gold:#FFC66B;--iris:#8E83FF;--irisbg:rgba(142,131,255,.14);
--f:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;--fd:"Chakra Petch",Manrope,system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--f);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(55% 45% at 0% 0%,rgba(255,122,26,.09),transparent 70%),radial-gradient(50% 45% at 100% 100%,rgba(142,131,255,.09),transparent 70%)}
h1,h2,h3{margin:0;line-height:1.12;font-weight:700;text-wrap:balance;font-family:var(--fd);letter-spacing:-.005em}
p{margin:0}
b,strong{font-weight:800}
::selection{background:rgba(255,122,26,.35)}
/* barra superior: logo = inicio, estado y Glow Bar */
.band{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(18,18,20,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.band>.in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:4px 8px 4px 4px;border-radius:16px;min-width:0;flex:1 1 200px;text-align:left}
.brand:focus-visible{outline:2px solid var(--o2);outline-offset:2px}
.lgw{position:relative;flex:0 0 auto}
.lg{width:46px;height:46px;border-radius:14px;object-fit:cover;display:block;background:#fff;box-shadow:0 0 0 1px var(--line2),0 0 18px rgba(255,122,26,.28);transition:box-shadow .25s,transform .25s}
.brand:hover .lg{box-shadow:0 0 0 2px var(--o),0 0 26px var(--glow);transform:rotate(-4deg) scale(1.04)}
.spk,.sp{position:absolute;width:8px;height:8px;background:var(--o2);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:tw 2.6s ease-in-out infinite;opacity:0;pointer-events:none}
.spk.a{top:-5px;right:-6px}.spk.b{bottom:-4px;left:-6px;width:6px;height:6px;animation-delay:.9s}.spk.c{top:42%;right:-11px;width:5px;height:5px;background:#fff;animation-delay:1.7s}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
.bt{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.band h1{font-size:clamp(1.2rem,4.4vw,1.55rem);text-transform:uppercase;letter-spacing:.06em}
.band .hd{font-size:.82rem;color:var(--mute);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.conn{display:inline-flex;align-items:center;gap:8px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.82rem;font-variant-numeric:tabular-nums;font-family:inherit}
.conn i{width:8px;height:8px;border-radius:50%;background:#6f6a78}
.conn.live i{background:var(--ok);box-shadow:0 0 0 4px rgba(69,214,154,.2);animation:pl 1.8s infinite}
button.conn{cursor:pointer}button.conn:hover{border-color:var(--line2)}
@keyframes pl{50%{box-shadow:0 0 0 7px rgba(69,214,154,0)}}
.gbar{position:absolute;left:0;right:0;bottom:-1px;height:5px;opacity:0;transition:opacity .5s}
.gbar.on{opacity:1;background:rgba(255,255,255,.05)}
.gbar i{position:relative;display:block;height:100%;width:100%;overflow:hidden;background:linear-gradient(90deg,var(--o),var(--o2));box-shadow:0 0 14px var(--glow),0 0 3px var(--o2);border-radius:0 99px 99px 0;transition:width .3s linear,background 1.5s,box-shadow 1.5s}
.gbar i::after{content:"";position:absolute;top:0;bottom:0;left:0;width:35%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:sh 2.6s linear infinite}
.gbar.low i{background:linear-gradient(90deg,#B86A34,#E2A065);box-shadow:0 0 10px rgba(226,160,101,.35)}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.hero{display:block;width:calc(100% - 32px);max-width:1068px;height:auto;max-height:230px;object-fit:cover;margin:16px auto 0;border-radius:22px;border:1px solid var(--line)}
body.ply .hero{display:none}
@media(max-width:600px){.hero{max-height:150px}.band .hd{display:none}.band .conn{font-size:.74rem;padding:4px 10px}.lg{width:40px;height:40px}}
main{max-width:1100px;margin:0 auto;padding:18px 16px 56px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0;box-shadow:0 22px 50px rgba(0,0,0,.35)}

.mute{color:var(--mute)}
.btn{font:inherit;font-family:var(--fd);font-weight:700;font-size:1.05rem;letter-spacing:.03em;color:var(--onO);border:0;border-radius:14px;padding:13px 24px;cursor:pointer;background:linear-gradient(180deg,var(--o2),var(--o));box-shadow:inset 0 0 0 1px rgba(255,200,140,.45),0 8px 24px rgba(255,122,26,.32);transition:transform .12s,box-shadow .2s;align-self:flex-start}

.btn:disabled{box-shadow:none;background:var(--card2);color:var(--mute);cursor:not-allowed}

.btn.sm{font-size:.88rem;padding:8px 16px;border-radius:12px}
.btn.wide{align-self:stretch;text-align:center}
.btn:focus-visible,.pk:focus-visible,.tpick:focus-visible,.inp:focus-visible,.pay:focus-visible,.ch:focus-visible{outline:2px solid var(--o2);outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inp{font:inherit;font-weight:700;padding:11px 16px;border:1px solid var(--line2);background:var(--deep);color:var(--fg);border-radius:12px;width:100%;min-width:0}
.inp:focus{border-color:var(--o);outline:none;box-shadow:0 0 0 3px rgba(255,122,26,.22)}
.inp::placeholder{color:#6f6a78}
.inp.code{font-family:var(--fd);font-size:1.4rem;letter-spacing:.3em;text-transform:uppercase;text-align:center;max-width:200px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.roles{grid-template-columns:1fr}}
.role{border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--card2);min-width:0}
.role .ic{width:46px;height:46px;border-radius:14px;background:var(--deep);border:1px solid var(--line2);color:var(--o2);display:grid;place-items:center}
.role .ic svg{width:24px;height:24px}
.err{color:var(--bad);font-weight:700;font-size:.95rem}
.err:empty{display:none}
.note{background:var(--deep);border:1px dashed var(--line2);border-radius:16px;padding:12px 14px;font-size:.95rem;color:var(--soft)}
.links{display:flex;flex-direction:column;gap:10px}
.lk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--deep);border:1px solid var(--line);border-radius:16px;padding:10px 12px}

@media(max-width:560px){.lk{grid-template-columns:1fr}.lk .btn{justify-self:start}}
.codebox{display:flex;flex-wrap:wrap;align-items:center;gap:18px;background:var(--deep);border:1px solid var(--line2);color:var(--fg);border-radius:20px;padding:16px 20px}
.codebox .c{display:block;font-family:var(--fd);font-size:clamp(2.6rem,9vw,4.2rem);font-weight:700;letter-spacing:.18em;color:var(--o2);text-shadow:0 0 26px var(--glow);font-variant-numeric:tabular-nums;line-height:1}
.codebox small{display:block;font-weight:600;color:var(--mute)}
.qr{background:#fff;border-radius:14px;padding:6px;width:150px;flex:0 0 auto}
.qr svg{display:block;width:100%;height:auto}
.codebox .tx{flex:1 1 220px;min-width:0}
.codebox ol{margin:8px 0 0;padding-left:20px;color:var(--soft)}
/* ronda: etiqueta tranquila, sin números de cuenta regresiva */
.clock{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap}
.pips{display:flex;gap:5px}
.pips i{width:22px;height:6px;border-radius:99px;background:var(--line)}

@keyframes brz{50%{opacity:.35;transform:scale(.7)}}
.ev{background:var(--deep);border:1px solid var(--line);border-left:3px solid var(--iris);color:var(--soft);padding:13px 16px;border-radius:16px}

.area{font-family:var(--fd);display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:var(--irisbg);color:#C9C3FF;border:1px solid rgba(142,131,255,.35);border-radius:99px;padding:3px 12px;align-self:flex-start}
.fx{display:flex;gap:6px;flex-wrap:wrap}

.step{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:700;font-size:1.2rem}
.step .n{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--deep);border:1px solid var(--line2);color:var(--o2);flex-shrink:0}
.pays{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:420px){.pays{grid-template-columns:1fr}}
.pay{font:inherit;color:var(--fg);text-align:left;border:1px solid var(--line2);background:var(--card2);border-radius:20px;padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:transform .15s,border-color .2s,box-shadow .25s}

.pay.on{border-color:var(--o);box-shadow:0 0 0 1px var(--o),0 0 26px var(--glow);background:linear-gradient(165deg,rgba(255,122,26,.14),var(--card2) 70%)}
.pay:disabled{opacity:.5;cursor:not-allowed}
.prev{background:var(--deep);border:1px solid var(--line);color:var(--soft);border-radius:16px;padding:12px 14px;font-size:.95rem;font-variant-numeric:tabular-nums}
.prev b{color:var(--gold)}
.sent{border-radius:16px;padding:12px 14px;font-weight:700;border:1px solid var(--line);background:var(--deep);color:var(--mute)}
.sent.ok{border-color:rgba(255,122,26,.6);background:rgba(255,122,26,.08);color:var(--fg);box-shadow:0 0 20px rgba(255,122,26,.15)}
.waitfx{display:flex;align-items:center;gap:10px;color:var(--mute);font-weight:600;font-size:.95rem}
.d3{display:inline-flex;gap:4px}
.d3 i{width:7px;height:7px;border-radius:50%;background:var(--o2);animation:bob 1.2s infinite ease-in-out}
.d3 i:nth-child(2){animation-delay:.15s}.d3 i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-6px);opacity:1}}
.wallet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--deep);border:1px solid var(--line);border-radius:16px;padding:10px 14px;font-variant-numeric:tabular-nums}
.wallet div{display:flex;flex-direction:column;min-width:0}

/* coordinador */
.teams{display:flex;flex-direction:column;gap:8px}
.tr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}

.ch .sty2{align-self:flex-start;font-family:var(--fd);font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);display:inline-flex;align-items:center;gap:7px}
.ch .sty2::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sc,#888)}
.sty2.y0{--sc:#FF8A7A}.sty2.y1{--sc:#5CC8FF}.sty2.y2{--sc:#B79CFF}
.ch .ttl{font-size:clamp(1.12rem,4vw,1.28rem);font-weight:800;line-height:1.22}
.ch .dsc{font-size:.97rem;color:var(--mute);line-height:1.45}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tg{display:inline-flex;align-items:baseline;gap:5px;font-weight:800;font-size:.95rem;border-radius:10px;padding:4px 10px;font-variant-numeric:tabular-nums}
.tg.cost{background:var(--deep);border:1px solid var(--line2);color:var(--gold);font-size:1.02rem}
.tg.win{background:var(--okbg);color:var(--ok)}
.tg.loss{background:var(--badbg);color:var(--bad)}
.tg small{font-weight:600;font-size:.72rem;opacity:.85}
.pr{display:flex;flex-direction:column;gap:5px}
.pl{font-size:.88rem;font-weight:600;color:var(--mute)}
.pl b{font-size:1.1rem;color:var(--fg)}
.meter{position:relative;display:block;height:8px;border-radius:99px;background:var(--deep);overflow:hidden}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--iris),#B9B1FF)}
.ch.on{border-color:var(--o);box-shadow:0 0 0 1px var(--o),0 0 36px var(--glow),0 18px 40px rgba(0,0,0,.5);transform:translateY(-4px);background:linear-gradient(180deg,#36271C,var(--card2));animation:sel .5s cubic-bezier(.2,.9,.3,1.3)}
.ch.on .ck{opacity:1;transform:scale(1)}
.ch.on .ltr{color:var(--o2)}
.chs.picked .ch:not(.on){opacity:.42;filter:saturate(.5)}
.ch:disabled{opacity:.5;cursor:not-allowed}
@keyframes sel{0%{transform:translateY(0)}45%{transform:translateY(-8px) rotateY(14deg) scale(1.03)}100%{transform:translateY(-4px)}}
.chs.deal .ch{animation:deal 1.15s cubic-bezier(.2,.85,.25,1.08) both;animation-delay:calc(var(--i,0) * .09s)}
@keyframes deal{0%{opacity:0;transform:translate(var(--sx),-34px) scale(.8)}
 14%{opacity:1;transform:translate(var(--sx),0) scale(.86) rotate(var(--r))}
 30%{transform:translate(calc(var(--sx) + var(--jx)),0) scale(.86) rotate(calc(var(--r) * -1))}
 46%{transform:translate(var(--sx),0) scale(.86) rotate(0deg)}
 100%{opacity:1;transform:none}}
/* ===== resultado: carta que se voltea ===== */
.flipw{perspective:1200px}
.flip{position:relative;display:grid;transform-style:preserve-3d;animation:flipCard .9s .35s cubic-bezier(.3,.9,.3,1.12) both}
.flip>.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;min-width:0}
.flip .back{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,#2A2A33 0 10px,#22222A 10px 20px);border:1px solid var(--line2);display:grid;place-items:center}
.flip .back img{width:72px;height:72px;border-radius:18px;box-shadow:0 0 30px var(--glow)}
.flip .front{background:var(--card2);border:1px solid var(--line2);padding:20px;display:flex;flex-direction:column;gap:10px}
@keyframes flipCard{from{transform:rotateY(-180deg)}to{transform:rotateY(0deg)}}
.flip.good .front{border-color:var(--o);box-shadow:0 0 0 1px var(--o),0 0 44px var(--glow);background:linear-gradient(170deg,rgba(255,122,26,.16),var(--card2) 60%);animation:glowIn .9s 1.15s both}
.flip.bad .front{border-color:rgba(224,122,127,.55);background:linear-gradient(170deg,rgba(224,122,127,.10),var(--card2) 60%);animation:shake .55s 1.25s both}
@keyframes glowIn{from{box-shadow:0 0 0 0 rgba(255,122,26,0)}to{box-shadow:0 0 0 1px var(--o),0 0 44px var(--glow)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.fr-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fr-l{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-family:var(--fd);font-size:1.6rem;font-weight:700;background:var(--deep);border:1px solid var(--line2)}
.good .fr-l{background:var(--o);color:var(--onO);border-color:var(--o);box-shadow:0 0 18px var(--glow)}
.fr-o{font-family:var(--fd);font-size:clamp(1.5rem,6vw,2.1rem);font-weight:700;line-height:1}
.good .fr-o{color:var(--o2);text-shadow:0 0 22px var(--glow)}.bad .fr-o{color:var(--bad)}
.fr-v{font-family:var(--fd);font-size:clamp(1.25rem,5vw,1.6rem);font-weight:700;font-variant-numeric:tabular-nums}
.fr-m{color:var(--soft)}
.achs{display:flex;gap:8px;flex-wrap:wrap}
.ach{display:inline-flex;gap:6px;align-items:center;padding:5px 12px;border-radius:99px;background:rgba(255,198,107,.12);border:1px solid rgba(255,198,107,.45);color:var(--gold);font-weight:800;font-size:.86rem;animation:pop .5s 1.6s both}
/* resultados por equipo */
.res{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;transform-origin:center top;animation:flipIn .6s cubic-bezier(.2,.8,.3,1.2) both;animation-delay:calc(var(--i,0) * .12s + .2s)}
@keyframes flipIn{from{opacity:0;transform:perspective(900px) rotateX(-75deg) translateY(-10px)}}
.res.good{border-color:rgba(255,122,26,.5);box-shadow:0 0 22px rgba(255,122,26,.14)}
.res.bad{border-color:rgba(224,122,127,.4)}
.res.bad .dice{animation:pop .5s .3s both,shake .5s .9s both}
.res.me{border-width:2px}
.res .hdr{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:800}
.dice{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 12px;font-weight:800;font-size:.9rem;animation:pop .5s .3s both}
.dice.ok{background:rgba(255,122,26,.15);color:var(--o2);box-shadow:0 0 14px rgba(255,122,26,.3)}.dice.no{background:var(--badbg);color:var(--bad)}
.ledger{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;font-variant-numeric:tabular-nums;font-size:.9rem}
.ledger div{background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column}
.ledger small{color:var(--mute);font-weight:700;font-size:.75rem}
.dval{font-family:var(--fd);font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums}
@keyframes pop{from{transform:scale(.3);opacity:0}}
div.win{background:linear-gradient(100deg,var(--o),var(--o2));color:var(--onO);border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:6px;font-weight:700;flex-wrap:wrap;box-shadow:0 0 30px rgba(255,122,26,.3)}
/* espera: mazo flotante */
.fdeck{position:relative;height:132px;display:flex;justify-content:center;align-items:center}
.fdeck.sm{height:100px;transform:scale(.8)}
.fc{width:66px;height:92px;border-radius:12px;background:repeating-linear-gradient(45deg,#2B2B34 0 8px,#24242C 8px 16px);border:1px solid var(--line2);display:grid;place-items:center;box-shadow:0 12px 26px rgba(0,0,0,.45);margin:0 -9px;animation:flt 3.2s ease-in-out infinite alternate}
.fc img{width:30px;height:30px;border-radius:8px}
.fc.f0{--rr:-12deg;animation-delay:-.4s}
.fc.f1{--rr:0deg;position:relative;z-index:1;animation-delay:-1.6s;border-color:rgba(255,122,26,.55);box-shadow:0 12px 26px rgba(0,0,0,.45),0 0 24px rgba(255,122,26,.28)}
.fc.f2{--rr:12deg;animation-delay:-2.4s}
@keyframes flt{from{transform:translateY(5px) rotate(var(--rr))}to{transform:translateY(-10px) rotate(calc(var(--rr) * 1.3))}}
.fdeck .s0{left:calc(50% - 86px);top:14px}.fdeck .s1{left:calc(50% + 74px);top:30px;animation-delay:.8s}
.fdeck .s2{left:calc(50% - 54px);bottom:8px;width:6px;height:6px;background:#fff;animation-delay:1.6s}.fdeck .s3{left:calc(50% + 50px);bottom:4px;background:var(--iris);animation-delay:2.2s}
.wcap{text-align:center;color:var(--mute);font-weight:700;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
/* liga lateral */
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.rank .nm{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.rank .nm span:first-child{min-width:0;overflow-wrap:anywhere}
.rank .nm span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
.rank .bar{height:8px;background:var(--deep);margin-top:5px;border-radius:999px;overflow:hidden}
.rank .bar i{display:block;height:100%;background:var(--iris);border-radius:99px;transition:width .8s}
.rank li:first-child .bar i{background:linear-gradient(90deg,var(--gold),var(--o2));box-shadow:0 0 10px rgba(255,198,107,.5)}
.rank small{color:var(--mute);font-variant-numeric:tabular-nums;display:block;font-size:.8rem}
.rank li.me{outline:1.5px solid var(--o);outline-offset:6px;border-radius:12px;box-shadow:0 0 22px rgba(255,122,26,.18)}
/* podio */
.champ{display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,#33231A,var(--card2));color:var(--fg);border:1px solid var(--o);border-radius:22px;padding:14px 20px;flex-wrap:wrap;box-shadow:0 0 34px rgba(255,122,26,.25)}
.champ .tro{font-size:2.6rem}
.champ .tx{min-width:0;flex:1;color:var(--soft)}
.champ b{display:block;font-family:var(--fd);color:var(--gold);font-size:clamp(1.4rem,5vw,2.1rem);font-weight:700;line-height:1.1}
.proud{display:flex;gap:14px;align-items:center;background:var(--card2);border:1px solid var(--line2);border-radius:20px;padding:16px 18px;animation:pop .6s .4s both}
.proud.gold{border-color:var(--o);box-shadow:0 0 36px var(--glow);background:linear-gradient(120deg,rgba(255,122,26,.18),var(--card2))}
.proud .pi{font-size:2.6rem;line-height:1}
.proud b{display:block;font-family:var(--fd);font-size:clamp(1.2rem,4.6vw,1.6rem);line-height:1.15}
.proud span span{color:var(--soft)}
.stage{position:relative;overflow:hidden;background:radial-gradient(80% 70% at 50% 0%,rgba(255,122,26,.25),transparent 70%),linear-gradient(180deg,#1C1C22,#121214);border:1px solid var(--line);border-radius:24px;padding:22px 10px 0}
.stage h3{color:var(--fg);text-align:center;margin-bottom:10px;position:relative;z-index:1}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:8px;position:relative;z-index:1}
.col{flex:1;max-width:200px;min-width:0;text-align:center;color:var(--fg);display:flex;flex-direction:column;align-items:center;animation:rise .8s var(--d) both}
.col .av{font-size:clamp(2rem,7vw,2.8rem);animation:bnc 1s calc(var(--d) + .8s) infinite alternate}
.col .nmx{font-weight:800;margin:2px 0 4px;font-size:clamp(.8rem,3vw,1rem);line-height:1.15;overflow-wrap:anywhere}
.col .vv{font-weight:800;font-size:clamp(.72rem,2.6vw,.9rem);color:var(--gold);margin-bottom:6px;font-variant-numeric:tabular-nums}
.col .blk{width:100%;height:var(--h);border-radius:16px 16px 0 0;padding-top:8px;font-weight:900;display:flex;flex-direction:column;align-items:center;animation:grow 1s var(--d) cubic-bezier(.2,.9,.3,1.2) both;color:var(--onO)}
.col .blk .pn{font-family:var(--fd);font-size:clamp(2.4rem,9vw,4rem);line-height:1}
.col .blk small{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.col.p1 .blk{background:linear-gradient(180deg,#FFE29A,var(--gold));box-shadow:0 0 40px rgba(255,198,107,.45)}
.col.p2 .blk{background:linear-gradient(180deg,#F3F0EC,#B9B2AA)}
.col.p3 .blk{background:linear-gradient(180deg,#F2B07E,#C0703A)}
.col.p1 .nmx{font-size:clamp(.95rem,3.4vw,1.2rem)}
@keyframes bnc{to{transform:translateY(-8px)}}
@keyframes grow{from{height:0}}
@keyframes rise{from{opacity:0;transform:translateY(30px)}}
.cf{position:absolute;top:-16px;width:9px;height:14px;opacity:0;animation:fall var(--t) linear var(--cd) infinite}
@keyframes fall{10%{opacity:1}90%{opacity:1}to{transform:translateY(460px) rotate(720deg);opacity:0}}
.hb{display:flex;flex-direction:column;gap:10px}
.hb .r{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:8px;align-items:center}
.hb .pos{font-weight:800;font-size:1.05rem;text-align:center;border-radius:12px;padding:4px 0;background:var(--card2);color:var(--fg)}
.hb .r.p1 .pos{background:var(--gold);color:var(--onO)}.hb .r.p2 .pos{background:#D9D3CC;color:var(--onO)}.hb .r.p3 .pos{background:#E59A62;color:var(--onO)}
.hb .lbl{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:.95rem}
.hb .lbl span:first-child{min-width:0;overflow-wrap:anywhere}
.hb .lbl span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.mbar{height:14px;background:var(--deep);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:4px}
.mb{height:100%;width:var(--w);background:linear-gradient(90deg,var(--iris),#B9B1FF);border-radius:99px;animation:wb 1.4s var(--d) both}
.hb .r.p1 .mb{background:linear-gradient(90deg,var(--o),var(--gold));box-shadow:0 0 12px var(--glow)}
@keyframes wb{from{width:0}}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%}
td{border-top:1px solid var(--line);padding:7px 8px 7px 0;vertical-align:top;color:var(--soft)}
td b{color:var(--fg)}
/* ceremonia */
.cer{background:radial-gradient(70% 60% at 50% 0%,rgba(255,122,26,.3),transparent 70%),linear-gradient(180deg,#1E1E24,#121214);border:1px solid var(--line);color:var(--fg);border-radius:24px;padding:26px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;position:relative;overflow:hidden}
.cer .md{font-size:clamp(4rem,16vw,7rem);line-height:1;animation:pop .7s both,bnc 1s .7s infinite alternate}
.cer .who{font-family:var(--fd);font-size:clamp(1.8rem,7vw,3.2rem);font-weight:700;color:var(--gold);line-height:1.05;text-shadow:0 0 30px rgba(255,198,107,.4)}
.cer .act{background:var(--o);color:var(--onO);border-radius:18px;padding:14px 18px;font-weight:800;font-size:clamp(1.05rem,4vw,1.35rem);max-width:640px;box-shadow:0 0 30px var(--glow)}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.2)}
.dots i.on{background:var(--gold);box-shadow:0 0 10px rgba(255,198,107,.6)}
.myturn{background:linear-gradient(160deg,var(--o2),var(--o));color:var(--onO);border-radius:24px;padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;animation:pulse 1.4s infinite alternate}
.myturn .md{font-size:5rem;line-height:1}
.myturn h2{font-size:clamp(1.8rem,8vw,2.6rem)}
@keyframes pulse{to{box-shadow:0 0 0 10px rgba(255,122,26,.16),0 0 56px rgba(255,122,26,.5)}}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--card2);color:var(--fg);border:1px solid var(--line2);font-weight:700;padding:10px 18px;border-radius:14px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 14px 40px rgba(0,0,0,.5)}
/* ===== Identidad CEO León: héroe, equipos con mascota y botones de juego ===== */
body::before{background:radial-gradient(70% 40% at 50% 0%,rgba(255,110,20,.16),transparent 70%),radial-gradient(55% 45% at 0% 100%,rgba(190,60,10,.10),transparent 70%),radial-gradient(50% 45% at 100% 100%,rgba(142,131,255,.07),transparent 70%)}
.heroW{display:none;position:relative;width:calc(100% - 32px);max-width:1068px;margin:16px auto 0;border-radius:24px;overflow:hidden;border:1px solid rgba(255,140,60,.35);box-shadow:0 0 0 1px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.5),0 0 60px rgba(255,110,20,.18);aspect-ratio:1024/408;background:#3a1606}
body.hh .heroW{display:block}
.hero2{display:block;width:100%;height:100%;object-fit:cover}
.hbtn{position:absolute;top:12.7%;width:8.8%;height:23.4%;border:0;border-radius:14%;background:transparent;cursor:pointer;transition:box-shadow .2s,background .2s}
.hbtn:hover,.hbtn:focus-visible{background:rgba(255,140,60,.12);box-shadow:0 0 0 2px var(--o),0 0 22px var(--glow);outline:none}
.hbtn.off{background:rgba(0,0,0,.45)}
@media(max-width:600px){.heroW{border-radius:16px;margin-top:12px}}
.etitle{display:flex;align-items:center;gap:14px;font-family:var(--fd);font-weight:700;font-size:clamp(.95rem,3vw,1.2rem);letter-spacing:.14em;text-transform:uppercase;color:var(--fg);text-align:center}
.etitle::before,.etitle::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,140,60,.6))}
.etitle::after{background:linear-gradient(90deg,rgba(255,140,60,.6),transparent)}
/* tarjetas de equipo */
.tcards{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:14px}
@media(max-width:640px){.tcards{grid-template-columns:1fr 1fr;gap:10px}}
.tcard{--g1:#5A0F0A;--g2:#1A0405;--bd:#8B2A12;--hi:#FF6A2A;font:inherit;color:#fff;text-align:center;position:relative;display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:0 0 14px;border:2px solid var(--bd);border-radius:22px;background:linear-gradient(180deg,var(--g1),var(--g2));overflow:hidden;min-width:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 14px 30px rgba(0,0,0,.45);transition:transform .2s,box-shadow .25s,border-color .2s}
.tcard.t1{--g1:#E8640E;--g2:#7A2805;--bd:#FF8A3A;--hi:#FFB066}
.tcard.t2{--g1:#2C2C30;--g2:#0F0F11;--bd:#4A4A52;--hi:#FF7A1A}
.tcard.t3{--g1:#D99012;--g2:#8A5306;--bd:#F2B43C;--hi:#FFD27A}
.tart{display:block;aspect-ratio:213/178;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 72%,transparent);mask-image:linear-gradient(180deg,#000 72%,transparent)}
.tart img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .35s}
.tnm{font-family:var(--fd);font-weight:700;text-transform:uppercase;font-size:clamp(.95rem,3.4vw,1.2rem);line-height:1.08;letter-spacing:.02em;padding:0 10px;margin-top:-8px;text-shadow:0 2px 8px rgba(0,0,0,.6);overflow-wrap:anywhere}
.tst{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(.62rem,1.9vw,.74rem);font-weight:700;color:var(--hi);padding:0 10px;font-variant-numeric:tabular-nums;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.tcard.t3 .tst{color:#3A1D05;text-shadow:none}
.tbar{display:block;height:12px;margin:2px 14px 0;border-radius:99px;background:rgba(255,220,190,.85);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,#1A0D04,#2A1508);border-radius:99px}
.tcard.t1 .tbar i,.tcard.t2 .tbar i,.tcard.t3 .tbar i{background:linear-gradient(90deg,#E8520A,#FF7A1A)}
.tpts{font-family:var(--fd);font-weight:700;font-size:1.02rem;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.tcard.t3 .tpts,.tcard.t3 .tnm{color:#fff}
.tcard small{font-size:.76rem;font-weight:700;opacity:.9;padding:0 8px}
button.tcard{cursor:pointer}
button.tcard:hover,.tcard.mine{transform:translateY(-6px);border-color:#FFC27A;box-shadow:0 0 0 2px var(--o),0 0 34px var(--glow),0 18px 36px rgba(0,0,0,.5)}
button.tcard:hover .tart img,.tcard.mine .tart img{transform:scale(1.06)}
.tcard.mine{animation:flt2 3s ease-in-out infinite alternate}
.tcard.mine::after{content:"SU EQUIPO";position:absolute;top:10px;right:10px;font-family:var(--fd);font-size:.66rem;font-weight:700;letter-spacing:.1em;background:var(--o);color:var(--onO);padding:3px 8px;border-radius:99px}
.tcards.picked .tcard:not(.mine){opacity:.55;filter:saturate(.6)}
@keyframes flt2{from{transform:translateY(-4px)}to{transform:translateY(-10px)}}
.tcard .inp{background:rgba(0,0,0,.35);border-color:rgba(255,255,255,.25);color:#fff;text-align:center;font-family:var(--fd);text-transform:uppercase;font-size:.82rem;margin:-6px 8px 0;width:calc(100% - 16px)!important;width:calc(100% - 20px);padding:8px 10px}
.tcard .dv{font-size:.78rem;font-weight:700;min-height:1.1em}
.av{width:1.7em;height:1.7em;border-radius:50%;object-fit:cover;object-position:center 30%;vertical-align:middle;margin-right:.45em;border:1.5px solid var(--o);background:#1a0d04}
/* botones estilo arcade */
.btn{text-transform:uppercase;letter-spacing:.05em;border-radius:16px;background:linear-gradient(180deg,#FF9A3D,#F06A12 55%,#D9550A);border:2px solid #FFB066;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(120,40,0,.35),0 0 0 3px rgba(26,13,4,.85),0 10px 28px rgba(255,110,20,.4);color:#fff;text-shadow:0 1px 2px rgba(80,25,0,.6);display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn:hover:not(:disabled){box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -3px 0 rgba(120,40,0,.35),0 0 0 3px rgba(26,13,4,.85),0 12px 36px rgba(255,110,20,.6)}
.btn:disabled{border-color:var(--line2);text-shadow:none}
.btn.ghost{background:linear-gradient(180deg,#221C18,#16110E);border:1px solid rgba(255,140,60,.3);color:var(--fg);text-shadow:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 6px 18px rgba(0,0,0,.35)}
.btn.ghost:hover:not(:disabled){border-color:var(--o);box-shadow:0 0 0 1px var(--o),0 0 20px rgba(255,122,26,.25)}
.btn svg{width:1.4em;height:1.4em;flex:0 0 auto}
.btn.ghost svg{color:var(--o)}
.abar{display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:14px;align-items:stretch}
.abar .btn{align-self:stretch;min-height:72px;padding:12px 16px;font-size:clamp(.82rem,2.4vw,.98rem);line-height:1.15;text-align:left}
.abar .btn.big{font-size:clamp(1.15rem,3.6vw,1.65rem);justify-content:center;text-align:center}
.abar .btn.big svg{width:1.3em;height:1.3em;color:#FFF3E6;filter:drop-shadow(0 1px 2px rgba(80,25,0,.6))}
@media(max-width:640px){.abar{grid-template-columns:1fr 1fr}.abar .btn.big{grid-column:1/-1;order:-1}}
/* ===== alternativas tipo carta de juego ===== */
.ch .ltr{padding:10px 14px;gap:10px;justify-content:flex-start;border-bottom:0;color:#fff}
.ch .ltr.s0{background:linear-gradient(120deg,#FF6B3D,#C2410C)}
.ch .ltr.s1{background:linear-gradient(120deg,#22C3B0,#0F766E)}
.ch .ltr.s2{background:linear-gradient(120deg,#9B7BFF,#6D28D9)}
.ch .lt{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(0,0,0,.28);font-size:1.6rem;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.ch .ltr .sty2{color:#fff;font-size:.78rem;letter-spacing:.1em;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.ch .ltr .sty2::before{display:none}
.ch .ck{margin-left:auto}
.ch.on .ltr{color:#fff}
.ch.on .lt{background:var(--o);color:var(--onO)}
.ohd{display:flex;gap:12px;align-items:center}
.oic{flex:0 0 auto;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:2rem;background:radial-gradient(circle at 30% 25%,#3A3A46,#1A1A20);border:1px solid var(--line2);box-shadow:0 6px 16px rgba(0,0,0,.35);transition:transform .3s cubic-bezier(.2,.9,.3,1.5)}
button.ch:hover .oic,.ch.on .oic{transform:rotate(-8deg) scale(1.12)}
.tags{display:flex;flex-direction:column;gap:5px}
.tg{display:flex;align-items:center;gap:8px;padding:6px 10px;overflow:hidden;border-radius:12px;font-size:1rem;line-height:1.15;min-width:0;white-space:nowrap}
.tg i{font-style:normal;font-size:1.15rem;line-height:1}
.tg small{flex:1;font-size:.7rem;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.05em}
.tg.cost{font-size:1.02rem}
.ch .ltr .sty2{white-space:nowrap}
.pr .pl{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.pr .pl em{font-style:normal;margin-left:auto;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:99px}
.pr.lo em{background:var(--okbg);color:var(--ok)}.pr.md em{background:rgba(255,198,107,.14);color:var(--gold)}.pr.hi em{background:var(--badbg);color:var(--bad)}
.seg{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.seg i{height:9px;border-radius:3px;background:var(--deep)}
.pr.lo .seg i.on{background:var(--ok)}.pr.md .seg i.on{background:var(--gold)}.pr.hi .seg i.on{background:var(--bad)}
/* ===== cartera divertida ===== */
.wallet2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-variant-numeric:tabular-nums}
.wt{position:relative;background:var(--deep);border:1px solid var(--line);border-radius:16px;padding:10px 12px 12px;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.wt .we{font-size:1.4rem;line-height:1}
.wt small{font-size:.7rem;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.wt b{font-family:var(--fd);font-size:clamp(.9rem,3.6vw,1.2rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt.cash b{color:var(--ok)}.wt.val b{color:var(--gold)}.wt.debt b.dn{color:var(--bad)}
.wt.val{border-color:rgba(255,198,107,.4);box-shadow:0 0 18px rgba(255,198,107,.12)}
.coinz{position:absolute;right:8px;bottom:6px;display:flex;flex-direction:column-reverse;align-items:center}
.coinz i{display:block;width:22px;height:6px;margin-top:-1px;border-radius:50%;background:linear-gradient(180deg,#FFE29A,#D99012);box-shadow:0 1px 0 #8A5306;animation:cin .4s calc(var(--k) * .08s) both}
@keyframes cin{from{transform:translateY(-14px);opacity:0}}
.mood{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-weight:800;background:linear-gradient(90deg,rgba(255,122,26,.12),transparent);border:1px solid rgba(255,122,26,.25);border-radius:14px;padding:8px 12px}
.mood span{font-size:1.6rem;line-height:1;animation:wig 2.4s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(0)}10%{transform:rotate(-12deg)}20%{transform:rotate(10deg)}30%{transform:rotate(0)}}
/* ===== lluvia de dinero en el resultado ===== */
.flip .front{position:relative;overflow:hidden}
.mfx{position:absolute;inset:0;pointer-events:none;z-index:0}
.flip .front>*:not(.mfx){position:relative;z-index:1}
.mfx i{position:absolute;font-style:normal;font-size:1.5rem;opacity:0}
.mfx.gain i{top:-30px;animation:mrain var(--d) linear 1.25s 2 both}
.mfx.loss i{bottom:-30px;animation:mfly var(--d) ease-in 1.25s 1 both}
@keyframes mrain{0%{opacity:0;transform:translateY(0) rotate(0)}10%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translateY(360px) rotate(var(--r))}}
@keyframes mfly{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--r),-340px) rotate(var(--r))}}
.fr-big{font-family:var(--fd);font-size:clamp(2rem,9vw,3rem);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;animation:pop .6s 1.3s both}
.fr-big.up{text-shadow:0 0 26px rgba(69,214,154,.45)}
.win{position:relative;overflow:hidden}
.wrain{position:absolute;inset:0;pointer-events:none}
.wrain i{position:absolute;top:-24px;font-style:normal;animation:mrain 2.2s linear infinite}
.wrain i:nth-child(1){left:8%}.wrain i:nth-child(2){left:30%;animation-delay:.5s}.wrain i:nth-child(3){left:52%;animation-delay:1s}.wrain i:nth-child(4){left:74%;animation-delay:.3s}.wrain i:nth-child(5){left:92%;animation-delay:1.4s}
/* ===== carrera de millones ===== */
.track{position:relative;height:38px;margin-top:6px;border-radius:12px;background:repeating-linear-gradient(90deg,var(--deep) 0 18px,#1A1A20 18px 36px);border:1px solid var(--line);overflow:visible}
.track .trail{position:absolute;left:0;top:50%;height:4px;transform:translateY(-50%);border-radius:99px;background:linear-gradient(90deg,transparent,var(--iris));transition:width 1s}
.rank li:first-child .track .trail{background:linear-gradient(90deg,transparent,var(--gold));box-shadow:0 0 10px rgba(255,198,107,.5)}
.runner{position:absolute;top:50%;width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:center 30%;transform:translate(-100%,-50%);border:2px solid var(--o);background:#1a0d04;box-shadow:0 0 12px var(--glow);transition:left 1.2s cubic-bezier(.3,.9,.3,1.1);animation:run .5s ease-in-out infinite alternate}
.rank li:first-child .runner{border-color:var(--gold);box-shadow:0 0 16px rgba(255,198,107,.7)}
@keyframes run{to{margin-top:-3px}}
.flag{position:absolute;right:-6px;top:-10px;font-size:1rem}
.dpop{position:absolute;top:-14px;transform:translateX(-60%);font-size:.72rem;font-weight:800;background:var(--card2);border:1px solid var(--line2);border-radius:99px;padding:0 6px;white-space:nowrap;animation:pop .5s .6s both}
.track{margin-left:30px}
.pips{flex-wrap:wrap;max-width:100%}
.pips i{width:clamp(7px,1.6vw,16px)}
/* ya visto o saltado: sin repetir animaciones */
.seen .tcard.mine,.seen .mfx i,.seen .fr-big,.seen .res,.seen .flip,.seen .flip .front,.seen .dice,.seen .ach,.seen .proud,.seen .col,.seen .col .blk,.seen .mb{animation:none!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function clamp(v){return Math.max(0,Math.min(100,v))}
function r1k(v){return Math.round(v/1000)*1000}
function fmt(n){return (n<0?"−":"")+"$"+Math.abs(Math.round(n)).toLocaleString("es-MX")}
function sgn(n){return (n>0?"+":n<0?"−":"")+"$"+Math.abs(Math.round(n)).toLocaleString("es-MX")}
function pct(p){return Math.round(p*100)+" %"}
function crises(t){return t.k.filter(function(v){return v<20}).length}
function value(t){return t.cash-t.debt+PT*(t.k[0]+t.k[1]+t.k[2])-CRISIS*crises(t)}
function ksum(t){return t.k[0]+t.k[1]+t.k[2]}
/* Orden: valor; si empatan, menor deuda; luego más puntos en indicadores; al final, sorteo hecho al iniciar la partida (nunca por nombre ni por orden de registro). */
function ranked(){return G.teams.slice().sort(function(x,y){return value(y)-value(x)||x.debt-y.debt||ksum(y)-ksum(x)||(y.tb||0)-(x.tb||0)})}
function rand(){try{var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296}catch(e){return Math.random()}}
function rnd(n){var a="ABCDEFGHJKMNPQRSTUVWXYZ23456789",s="";for(var i=0;i<n;i++)s+=a[Math.floor(rand()*a.length)];return s}
function clone(o){return JSON.parse(JSON.stringify(o))}

function newGame(code,names,n,tr,nr){n=n||4;names=names||NM;return{v:2,code:code,n:n,tr:tr||30,nr:nr||18,r:0,ph:"lobby",rid:"",t0:0,t1:0,t2:0,t3:0,cs:0,
  teams:names.slice(0,n).map(function(x,i){return{name:x||NM[i],cash:START,debt:0,k:[50,50,50],st:[0,0,0],tb:rand()}}),res:null,hist:[]}}

/* ===== sala en vivo (votos por presencia) ===== */
function peers(){try{return RM?RM.peers():[]}catch(e){return[]}}
function players(){return peers().filter(function(p){return p.presence&&p.presence.role==="player"})}
function devCount(i){return players().filter(function(p){return p.presence.team===i}).length}
function teamState(i){var best=null;players().forEach(function(p){var s=p.presence;if(s.team===i&&G&&s.rid===G.rid&&typeof s.ts==="number"&&(!best||s.ts>best.ts))best=s});return best}
function effPick(i){if(ov[i]!=null)return ov[i];var s=teamState(i);return s&&typeof s.pick==="number"&&s.pick>=0&&s.pick<3?s.pick:-1}
function effLv(i){if(ovlv[i]!=null)return ovlv[i];var s=teamState(i);return !!(s&&s.lv)}
async function enterRoom(role){
  if(!CAP.room){roomOk=false;return}
  try{if(RM){try{if(offPeers)offPeers();await RM.leave()}catch(e){}}
    RM=await CAP.room.join("ceo-"+CODE.toLowerCase());
    await RM.presence({role:role,team:myTeam});
    offPeers=RM.onPeers(function(){updateLive()},function(){roomOk=false;updateLive()});
    roomOk=true}
  catch(e){roomOk=false;toast("No se pudo abrir la sala en vivo en este dispositivo.")}
  updateLive();
}

async function hostResume(code){window.__ceoRole="host";

  var s;try{s=await CAP.db.doc("games/"+code).get()}catch(e){$("herr").textContent="No se pudo leer la partida.";return}
  if(!s.exists||!s.data().v){$("herr").textContent="No encontramos la partida "+code+".";return}
  CODE=code;G=clone(s.data());remote=true;gdoc=CAP.db.doc("games/"+code);ls("ceoHost",code);MODE="host";ov={};ovlv={};

function setN(n){var names=G.teams.map(function(t){return t.name});for(var i=names.length;i<n;i++)names.push(NM[i]);G.teams=newGame(CODE,names,n).teams;G.n=n;save()}
function setTr(s){G.tr=s;save()}
function setNr(n){G.nr=n;save()}
function startGame(){var g=newGame(CODE,G.teams.map(function(t){return t.name}),G.n,G.tr);G.teams=g.teams;G.r=0;G.res=null;G.hist=[];goRound()}
function goRound(){AR=0;FR=0;NX=0;G.ph="round";G.rid=rnd(6);G.t0=Date.now();G.res=null;ov={};ovlv={};save()}
function doReveal(force){
  if(!G||G.ph!=="round")return;
  var q=R[CI(G.r)],cnt=[0,0,0];
  var picks=G.teams.map(function(t,i){return effPick(i)}),lvs=G.teams.map(function(t,i){return effLv(i)});
  if(force!==true&&picks.some(function(p){return p<0}))return;
  picks.forEach(function(p){if(p>=0)cnt[p]++});
  G.res=G.teams.map(function(t,i){
    var before=value(t),p=picks[i],r={pick:p,lv:false,inv:0,own:0,bor:0,fee:0,ok:null,ret:0,uniq:false,dk:[0,0,0],cash0:t.cash,debt0:t.debt};
    if(p<0){t.cash-=NODEC_CASH;r.dk=[-5,-5,-5]}
    else{var o=q.o[p],lv=!!lvs[i],inv=o.c*(lv?2:1),own=Math.min(Math.max(0,t.cash),o.c),bor=inv-own,fee=r1k(bor*RATE);
      t.cash-=own;t.debt+=bor+fee;var ok=rand()<o.p,ret=r1k(inv*(ok?o.s:o.f));t.cash+=ret;
      r.lv=lv;r.inv=inv;r.own=own;r.bor=bor;r.fee=fee;r.ok=ok;r.ret=ret;r.dk=o.k.slice();t.st[o.y]++}
    t.cash+=q.e.cash;
    if(t.cash<0){var d=-t.cash,f=r1k(d*RATE);t.debt+=d+f;r.bor+=d;r.fee+=f;t.cash=0}
    r.dk=r.dk.map(function(x,k){return x+q.e.k[k]});
    if(p>=0&&G.n>=3&&cnt[p]===1){r.uniq=true;r.dk[2]+=6}
    t.k=t.k.map(function(v,k){return clamp(v+r.dk[k])});
    r.dv=value(t)-before;r.dcash=t.cash-r.cash0;r.ddebt=t.debt-r.debt0;
    return r});
  var hh=(G.hist||[]).slice(0,G.r);hh[G.r]=G.teams.map(value);G.hist=hh;G.t1=Date.now();G.ph="reveal";ov={};ovlv={};AR=0;NX=0;save();
}
/* Todos los equipos empatados en el mayor valor ganado comparten el Rugido de la ronda. */
function rw(){var bs=-Infinity;G.res.forEach(function(r){if(r.dv>bs)bs=r.dv});var w=[];G.res.forEach(function(r,i){if(r.dv===bs)w.push(i)});return w}
function nextRound(){if(G.r>=NR()-1){G.ph="final";G.t3=Date.now();save()}else{G.r++;goRound()}}
function cerSteps(){var n=Math.min(3,G.teams.length),s=[];for(var i=n-1;i>=0;i--)s.push(i);s.push(-1);return s}
function startCeremony(){G.ph="ceremony";G.cs=0;G.t2=Date.now();save()}
function cerNext(){var st=cerSteps();if(G.cs<st.length-1){G.cs++;G.t2=Date.now();save()}}
function replay(){G=newGame(CODE,G.teams.map(function(t){return t.name}),G.n,G.tr,G.nr);ov={};ovlv={};save()}

async function playerJoin(code,auto){window.__ceoRole="player";
  code=(code||"").trim().toUpperCase();var err=$("perr");
  if(!code){if(err)err.textContent="Escriban el código que aparece en el proyector.";return}
  var s;try{s=await CAP.db.doc("games/"+code).get()}catch(e){if(err)err.textContent="No se pudo leer la partida. Revisen su conexión.";return}
  if(!s.exists||!s.data().v){if(err)err.textContent="No encontramos la partida "+code+". Revisen el código.";else if(auto){waiting=true;renderAll()}return}
  CODE=code;G=clone(s.data());remote=true;MODE="player";waiting=false;ls("ceoJoin",code);document.body.classList.add("ply");
  var t=parseInt(ls("ceoTeam-"+code),10);myTeam=isNaN(t)?-1:t;if(myTeam>=G.n)myTeam=-1;
  gdoc=CAP.db.doc("games/"+code);
  if(unsub)try{unsub()}catch(e){}
  unsub=gdoc.onSnapshot(function(sn){if(sn.exists){G=clone(sn.data());if(myTeam>=G.n)setTeam(-1);renderAll()}},function(){toast("Se perdió la conexión con la partida. Recarguen la página.")});
  watchLive();
  await enterRoom("player");lastKey="";renderAll();window.scrollTo(0,0);
}
function setTeam(i){myTeam=i;ls("ceoTeam-"+CODE,i<0?null:String(i));if(RM)RM.presence({team:i}).catch(function(){});lastKey="";renderAll();window.scrollTo(0,0)}
function sendPick(pick,lv){if(!RM||!roomOk){toast("Este celular no puede votar en vivo. Avisen al coordinador.");return}
  RM.presence({team:myTeam,rid:G.rid,pick:pick,lv:lv,ts:Date.now()}).then(function(){updateLive()}).catch(function(){toast("No se pudo enviar la decisión. Toquen otra vez.")})}

function renderAll(){
  var key=MODE+"|"+capsReady+"|"+canHost+"|"+myTeam+"|"+roomOk+"|"+waiting+"|"+HASH+"|"+JSON.stringify(G);
  if(key!==lastKey){lastKey=key;
    var a=document.activeElement,keep=a&&a.id&&/^nm\d$/.test(a.id)&&MODE==="host"&&G&&G.ph==="lobby";
    if(!keep){renderMain();renderBoard();bindCopy($("P"))}
  }
  document.body.classList.toggle("ply",MODE!=="home");
  document.body.classList.toggle("hh",MODE==="home"||!!(G&&(G.ph==="lobby"||(MODE==="player"&&(myTeam<0||myTeam>=G.n)))));bandH();
  updateLive();soundCue();
}
function renderMain(){
  var P=$("P");
  if(MODE==="home"){$("hd").textContent="Taller León · Anáhuac Cancún";P.innerHTML=homeHTML();bindHome();return}
  if(MODE==="host"){
    if(G.ph==="lobby")return hostLobby(P);
    if(G.ph==="round")return roundView(P);
    if(G.ph==="reveal")return revealView(P,true);
    if(G.ph==="final")return finalView(P,true);
    return ceremonyView(P,true);
  }
  if(myTeam<0||myTeam>=G.n)return pickTeam(P);
  if(G.ph==="lobby")return playerLobby(P);
  if(G.ph==="round")return playerRound(P);
  if(G.ph==="reveal")return revealView(P,false);
  if(G.ph==="final")return finalView(P,false);
  return ceremonyView(P,false);
}

function bindHome(){

  if(b=$("hNew"))b.onclick=function(){b.disabled=true;hostCreate().finally(function(){if($("hNew"))$("hNew").disabled=false})};
  if(b=$("hRes"))b.onclick=function(){hostResume($("hCode").value)};
  if(b=$("pAuto"))b.onclick=function(){autoJoin()};
  if(b=$("pJoin"))b.onclick=function(){b.disabled=true;playerJoin($("pCode").value).finally(function(){if($("pJoin"))$("pJoin").disabled=false})};
  if(b=$("pCode"))b.onkeydown=function(e){if(e.key==="Enter")$("pJoin").click()};
  if(b=$("hCode"))b.onkeydown=function(e){if(e.key==="Enter")$("hRes").click()};
  if(b=$("hLoc"))b.onclick=hostLocal;
  bindAbar();if(b=$("abGo"))b.onclick=function(){if(canHost&&HASH!=="equipo"){b.disabled=true;hostCreate().finally(function(){if($("abGo"))$("abGo").disabled=false})}else autoJoin()};
}

  (o?'<span class="dice '+(r.ok?'ok':'no')+'">🎲 '+(r.ok?'¡Salió bien!':'Salió mal')+'</span>':'')+'</div>'+
  (o?'<small class="mute">'+esc(o.l)+'</small>':'<small class="dn">No decidieron: la competencia avanzó. −$50,000 y −5 en cada indicador.</small>')+
  '<div class="ledger">'+(o?'<div><small>Invirtieron</small><b>'+fmt(r.inv)+'</b></div><div><small>Recuperaron</small><b class="'+(r.ret>=r.inv?'up':'dn')+'">'+fmt(r.ret)+'</b></div>':'')+
  (r.bor>0?'<div><small>Préstamo + 20 %</small><b class="dn">'+fmt(r.bor+r.fee)+'</b></div>':'')+

  '<div class="fx">'+r.dk.map(function(x,k){return x?'<span class="'+(x>0?'up':'dn')+'">'+K[k]+' '+(x>0?'+':'−')+Math.abs(x)+'</span>':''}).join("")+(r.uniq?'<span class="up">Jugada única +6 Innovación</span>':'')+'</div>'+
  '<div class="dval">'+(r.dv>=0?'🤑':'💸')+' Valor de la empresa: <span class="'+(r.dv>=0?'up':'dn')+'">'+sgn(r.dv)+'</span> → '+fmt(value(t))+'</div></div>'}
function flipHTML(i){var q=R[CI(G.r)],t=G.teams[i],r=G.res[i],o=r.pick>=0?q.o[r.pick]:null,cls=o&&r.ok?'good':'bad',iw=rw().indexOf(i)>=0,a=[];

/* ===== sonido: rugido sintetizado ===== */
var AC=null,SNDON=ls("ceoSnd")!=="0",lastSnd="";
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC}
document.addEventListener("pointerdown",function(){ac()});
function roar(big){
  if(!SNDON)return;var c=ac();if(!c)return;var t=c.currentTime,D=big?2.4:1.3;
  var out=c.createGain(),lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2200;out.connect(lp);lp.connect(c.destination);
  out.gain.setValueAtTime(.0001,t);out.gain.exponentialRampToValueAtTime(.55,t+.12);out.gain.setValueAtTime(.55,t+D*.55);out.gain.exponentialRampToValueAtTime(.0001,t+D);
  var o=c.createOscillator();o.type="sawtooth";o.frequency.setValueAtTime(70,t);o.frequency.exponentialRampToValueAtTime(big?190:150,t+D*.35);o.frequency.exponentialRampToValueAtTime(95,t+D);
  var g=c.createGain();g.gain.value=.5;var lfo=c.createOscillator();lfo.frequency.value=26;var lg=c.createGain();lg.gain.value=.35;lfo.connect(lg);lg.connect(g.gain);
  var f1=c.createBiquadFilter();f1.type="bandpass";f1.Q.value=2.5;f1.frequency.setValueAtTime(500,t);f1.frequency.linearRampToValueAtTime(900,t+D*.4);
  o.connect(g);g.connect(f1);f1.connect(out);
  var nb=c.createBuffer(1,Math.floor(c.sampleRate*D),c.sampleRate),d=nb.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  var ns=c.createBufferSource();ns.buffer=nb;var f2=c.createBiquadFilter();f2.type="bandpass";f2.frequency.value=1100;f2.Q.value=.8;var ng=c.createGain();ng.gain.value=.35;
  ns.connect(f2);f2.connect(ng);ng.connect(out);
  [o,lfo,ns].forEach(function(x){x.start(t);x.stop(t+D)});
}

/* ===== efectos de dinero ===== */
var DECD={},lastTick=0,NB=null;
function noiseBuf(c){if(!NB){NB=c.createBuffer(1,c.sampleRate,c.sampleRate);var d=NB.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1}return NB}
function mf(m){return 440*Math.pow(2,(m-69)/12)}
function env(g,t,a,peak,dec){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+dec)}
function vTone(c,o,t,type,f,dur,v,cut,glide){var s=c.createOscillator();s.type=type;s.frequency.setValueAtTime(f,t);if(glide)s.frequency.exponentialRampToValueAtTime(glide,t+dur*.7);var g=c.createGain();env(g,t,.005,v,dur);
  if(cut){var fl=c.createBiquadFilter();fl.type="lowpass";fl.frequency.value=cut;s.connect(fl);fl.connect(g)}else s.connect(g);g.connect(o);s.start(t);s.stop(t+dur+.06)}
function vNoise(c,o,t,type,f,q,v,dec){var s=c.createBufferSource();s.buffer=noiseBuf(c);var fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q||.7;var g=c.createGain();env(g,t,.002,v,dec);s.connect(fl);fl.connect(g);g.connect(o);s.start(t,Math.random()*.5);s.stop(t+dec+.06)}
function fxOut(c){if(!AC.fx){AC.fx=c.createGain();AC.fx.gain.value=.9;AC.fx.connect(c.destination)}return AC.fx}
function kaching(){if(!SNDON)return;var c=ac();if(!c)return;var t=c.currentTime+.01,o=fxOut(c);
  vNoise(c,o,t,"bandpass",2500,1.5,.35,.07);vNoise(c,o,t+.05,"highpass",5000,.7,.15,.05);
  vTone(c,o,t+.06,"triangle",mf(91),.55,.32);vTone(c,o,t+.13,"triangle",mf(96),.7,.3);vTone(c,o,t+.13,"sine",mf(103),.5,.12);
  for(var i=0;i<7;i++)vTone(c,o,t+.2+i*.035,"sine",2600+Math.random()*2400,.12,.07)}
function bankSnd(){if(!SNDON)return;var c=ac();if(!c)return;var t=c.currentTime+.01,o=fxOut(c);
  vTone(c,o,t,"square",mf(60),.12,.12,1800);vTone(c,o,t+.1,"square",mf(64),.12,.12,1800);vTone(c,o,t+.2,"square",mf(67),.12,.12,1800);kaching()}
function coinRain(){if(!SNDON)return;var c=ac();if(!c)return;var t=c.currentTime+.05,o=fxOut(c);for(var i=0;i<18;i++){var tt=t+i*.06+Math.random()*.03;vTone(c,o,tt,"triangle",mf(88+Math.floor(Math.random()*12)),.18,.13)}}
function sadMoney(){if(!SNDON)return;var c=ac();if(!c)return;var t=c.currentTime+.02,o=fxOut(c);
  [[67,0],[66,.28],[65,.56],[64,.84]].forEach(function(x,i){vTone(c,o,t+x[1],"sawtooth",mf(x[0]-12),i<3?.3:.8,.18,1400,i<3?0:mf(x[0]-14))})}
function riffle(){if(!SNDON)return;var c=ac();if(!c)return;var t=c.currentTime+.02,o=fxOut(c);for(var i=0;i<12;i++)vNoise(c,o,t+i*.035+Math.random()*.01,"highpass",3500+Math.random()*2500,.8,.09,.03);vNoise(c,o,t+.5,"bandpass",900,1,.12,.08)}
function achv(){if(!SNDON)return;var c=ac();if(!c)return;var t=c.currentTime+.02,o=fxOut(c);[76,81,84,88].forEach(function(m,i){vTone(c,o,t+i*.08,"triangle",mf(m),.35,.16);vTone(c,o,t+i*.08,"sine",mf(m+12),.25,.05)});for(var i=0;i<6;i++)vTone(c,o,t+.35+i*.04,"sine",3000+Math.random()*2500,.1,.04)}
function softMiss(){if(!SNDON)return;var c=ac();if(!c)return;var t=c.currentTime+.02,o=fxOut(c);vTone(c,o,t,"sine",mf(57),.35,.16,0,mf(52));vTone(c,o,t+.18,"sine",mf(52),.5,.12,900)}
function tick(hot){if(!SNDON)return;var c=ac();if(!c)return;var t=c.currentTime+.01,o=fxOut(c);vTone(c,o,t,"square",hot?1400:1000,.05,hot?.2:.12,4000)}

    if(AUTO&&more&&lc<=0)cerNext();
  }
},250);
